name: Offline CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: CLI quick start and synthetic replay
        run: |
          python -m routerbench --help
          python -m routerbench predict --inputs datasets/phase3/inputs.json --adapter rules --output runs/rules
          python -m routerbench score --run runs/rules --labels datasets/phase3/labels.json --output runs/rules-score.json
          python -m routerbench predict --inputs examples/inputs.json --adapter replay --responses examples/responses.jsonl --output runs/example
          python -m routerbench score --run runs/example --labels examples/labels.json --output runs/example-score.json
      - name: Audit and verify fresh source archive
        run: |
          python -m routerbench audit
          mkdir -p dist
          python -m routerbench export --output dist/routerbench-0.1.0.zip
          python -m zipfile -e dist/routerbench-0.1.0.zip dist/check
          cd dist/check/routerbench-0.1.0
          python -m unittest discover -s tests -v
